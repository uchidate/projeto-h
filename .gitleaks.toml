[extend]
useDefault = true

[allowlist]
description = "Artefatos locais ignorados pelo Git; o gate versionado não deve inspecioná-los"
paths = [
  '''(^|/)\.next/''',
  '''(^|/)\.lighthouseci/''',
  '''(^|/)\.env\.local$''',
  '''(^|/)\.gsc-credentials\.json$''',
  # Repositório de operação montado localmente: é outro repositório, varrido pelo seu próprio
  # gitleaks (`make secrets` lá), como os demais artefatos locais desta lista.
  '''(^|/)\.operacao/''',
]
