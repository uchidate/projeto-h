name: Update Streaming Artist Scores

# Roda em ubuntu-latest, nao no runner self-hosted.
#
# Em 2026-09-09 o socket do Docker foi removido do runner por seguranca: ele
# rodava como root com acesso de escrita a API do Docker, o que equivale a root
# no host. A analise da epoca olhou apenas os arquivos de workflow e concluiu
# que nenhum ativo usava Docker — mas nao olhou os SCRIPTS que eles chamam, e
# este usa `docker cp` e `docker exec`. O workflow quebrou no dia seguinte.
#
# A correcao mantem a melhoria de seguranca em vez de desfaze-la: o runner
# segue sem acesso ao Docker, e a operacao privilegiada passa por SSH, com
# chave dedicada e runner efemero. O script ja tinha esse modo pronto.

on:
  schedule:
    - cron: '0 5 * * *'  # Diariamente às 05:00 UTC (02:00 BRT)
  workflow_dispatch:       # Permite trigger manual

jobs:
  update:
    runs-on: ubuntu-latest
    # Sem isto, 5 execucoes em setembro/2026 ficaram presas em fila por 24h e
    # foram canceladas em silencio — o score nao atualizou nesses dias, sem
    # nenhum alerta. O padrao historico do job em si e ~1min (mediana medida
    # em 2026-09-15); 15min da folga generosa sem deixar um travamento real
    # rodar o dia inteiro sem ninguem notar.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Preparar operacao
        uses: ./.github/actions/preparar-operacao
        with:
          mascaras: ${{ secrets.IDENTIDADE_MASCARAS }}
          repositorio: ${{ vars.OPS_REPOSITORY }}
          chave: ${{ secrets.OPS_DEPLOY_KEY }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Conectar ao servidor
        uses: ./.github/actions/conectar-servidor
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          usuario: ${{ secrets.DEPLOY_USER }}
          chave: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Update artist streaming scores
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          WORDPRESS_API_URL: ${{ vars.WORDPRESS_API_URL }}
        run: node scripts/update-artist-streaming-scores.mjs --confirm

      - name: Trigger ISR revalidation (artists)
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          # Exceção de WAF da Cloudflare para automação nossa; sem ela o POST leva 403.
          SONDA_TOKEN: ${{ secrets.SONDA_TOKEN }}
        run: |
          curl -s -X POST \
            -H "${{ vars.SONDA_HEADER }}: ${SONDA_TOKEN}" \
            "${{ vars.SITE_URL }}/api/revalidate?secret=${REVALIDATE_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"type":"artist"}' \
            -w "Revalidation: %{http_code}\n"
