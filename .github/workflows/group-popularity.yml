name: Update Group Popularity Score

# Roda em ubuntu-latest, não no runner self-hosted (mesmo motivo das outras rotinas de nota).
#
# popularity_score do grupo = visitas ao artigo da Wikipédia em inglês nos últimos ~3 meses.
# Não tinha rotina: grupo cadastrado depois da última rodada manual ficava sem nota (13 de 163
# em 2026-11-15, entre eles Hearts2Hearts e CORTIS) e perdia 45% da relevância. Semanal, antes
# da rodada diária de group-relevance (07:05), que usa esta nota.

on:
  schedule:
    - cron: '30 6 * * 1'  # Toda segunda-feira às 06:30 UTC
  workflow_dispatch:       # Permite trigger manual

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Preparar operacao
        uses: ./.github/actions/preparar-operacao
        with:
          mascaras: ${{ secrets.IDENTIDADE_MASCARAS }}
          repositorio: ${{ vars.OPS_REPOSITORY }}
          chave: ${{ secrets.OPS_DEPLOY_KEY }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Conectar ao servidor
        uses: ./.github/actions/conectar-servidor
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          usuario: ${{ secrets.DEPLOY_USER }}
          chave: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Update group popularity
        env:
          WORDPRESS_API_URL: ${{ vars.WORDPRESS_API_URL }}
          # Exceção de WAF da Cloudflare: sem ela a REST do WP devolve 403 ao
          # runner e o job morre na primeira coleção (issue #19).
          SONDA_TOKEN: ${{ secrets.SONDA_TOKEN }}
        run: node scripts/update-group-popularity.mjs --confirm

      - name: Trigger ISR revalidation (groups)
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          # Exceção de WAF da Cloudflare para automação nossa; sem ela o POST leva 403.
          SONDA_TOKEN: ${{ secrets.SONDA_TOKEN }}
        run: |
          curl -s -X POST \
            -H "${{ vars.SONDA_HEADER }}: ${SONDA_TOKEN}" \
            "${{ vars.SITE_URL }}/api/revalidate?secret=${REVALIDATE_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"type":"group"}' \
            -w "Revalidation: %{http_code}\n"
