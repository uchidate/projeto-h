name: 🔎 Oportunidades de SEO

# Gera candidatos a título/descrição de SEO (Rank Math) para fichas de artista
# e grupo com muita impressão e posição >=1 no Search Console, mas ainda dentro
# do top 20 — oportunidade de ganhar clique sem depender de subir de posição.
# scripts/propor-seo-fichas.py já existia como ferramenta manual; isto só
# agenda a mesma leitura (Search Console + REST do WordPress, nada grava) e
# publica o resultado numa issue de revisão em vez de depender de alguém
# lembrar de rodar o script.
#
# Sem escrita automática de propósito: o manifesto (`ctr-manifesto.json`) fica
# só como anexo da issue. Aplicar exige `skills/atualizar-post-wp` com revisão
# editorial, como já documentado no cabeçalho do script.
on:
  schedule:
    # 07:10 UTC = 04:10 BRT, segunda-feira — depois da consolidação diária do
    # Search Console (exporta-seo.yml, 06:20 UTC) e numa janela livre dos
    # outros vigias agendados.
    - cron: '10 7 * * 1'
  workflow_dispatch:
    inputs:
      quantidade:
        description: 'Quantas fichas priorizar (top N por impressão)'
        required: false
        default: '25'

permissions:
  contents: read
  issues: write

concurrency:
  group: seo-oportunidades
  cancel-in-progress: false

jobs:
  propor:
    name: Levantar oportunidades
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Preparar operacao
        uses: ./.github/actions/preparar-operacao
        with:
          mascaras: ${{ secrets.IDENTIDADE_MASCARAS }}
          repositorio: ${{ vars.OPS_REPOSITORY }}
          chave: ${{ secrets.OPS_DEPLOY_KEY }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install --quiet google-auth google-api-python-client

      - name: Levantar candidatos
        id: propor
        env:
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
          WORDPRESS_API_URL: ${{ vars.WORDPRESS_API_URL }}
          SAIDA: ${{ runner.temp }}/seo-oportunidades
        run: |
          set -euo pipefail
          python3 scripts/propor-seo-fichas.py "$SAIDA" "${{ github.event.inputs.quantidade || '25' }}"
          echo "saida=$SAIDA" >> "$GITHUB_OUTPUT"

      - name: Publicar issue de revisão
        uses: actions/github-script@v9
        env:
          SAIDA: ${{ steps.propor.outputs.saida }}
        with:
          script: |
            const fs = require('fs')
            const titulo = '🔎 Oportunidades de SEO — fichas com CTR abaixo do esperado'
            const proposta = JSON.parse(fs.readFileSync(`${process.env.SAIDA}/ctr-proposta.json`, 'utf8'))

            const linhas = proposta.slice(0, 20).map((o) => {
              const buscas = (o.queries || []).slice(0, 3).join('; ')
              return `| ${o.post_type}/${o.slug} | ${o.impressions} | ${o.ctr}% | ${o.position} | ${buscas} |`
            })
            const tabela = [
              '| Ficha | Impressões (90d) | CTR | Posição | Principais buscas |',
              '|---|---|---|---|---|',
              ...linhas,
            ].join('\n')

            const corpo = [
              `Levantamento automático (\`scripts/propor-seo-fichas.py\`), execução ${new Date().toISOString()}.`,
              '',
              `${proposta.length} fichas com posição ≤20 e impressão alta no Brasil, últimos 90 dias.`,
              'Só leitura — nada foi gravado. Título e descrição propostos ficam em `ctr-proposta.json`',
              '(anexo desta execução) e em formato pronto para `skills/atualizar-post-wp` em `ctr-manifesto.json`.',
              '',
              tabela,
              '',
              '## Como aplicar',
              '',
              '1. Baixe os artefatos desta execução: ' +
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '2. Revise `ctr-proposta.json` (atual × proposto, buscas e sinais usados por ficha) — o título',
              '   e a descrição são gerados por regra, não por LLM, mas ainda pedem revisão editorial.',
              '3. Aplique com `skills/atualizar-post-wp` usando `ctr-manifesto.json` como manifesto.',
              '',
              '_Esta issue é reaberta/atualizada toda segunda-feira — não crie uma nova._',
            ].join('\n')

            const abertas = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'seo',
            })
            const existente = abertas.data.find((i) => i.title === titulo)
            if (existente) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existente.number,
                body: corpo,
              })
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existente.number,
                body: `Atualizado em ${new Date().toISOString()}.`,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: titulo,
                body: corpo,
                labels: ['seo'],
              })
            }

      - name: Guardar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: seo-oportunidades
          path: ${{ runner.temp }}/seo-oportunidades
          retention-days: 14
