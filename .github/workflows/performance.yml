name: ⚡ Core Web Vitals

# Roda o Lighthouse CI (.lighthouserc.cjs) contra produção — direto, sem build
# no runner: buildar exigiria dados reais do WordPress em build-time, e o que
# queremos medir é a experiência real do visitante, não a de um ambiente
# isolado. `npm run performance:audit` já existe e é a mesma ferramenta usada
# manualmente até aqui; isto só agenda e publica o resultado numa issue de
# revisão, igual seo-oportunidades.yml.
on:
  schedule:
    # 08:15 UTC = 05:15 BRT, segunda-feira — depois de seo-oportunidades.yml
    # (07:10 UTC), fora do horário de pico de acesso ao site.
    - cron: '15 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: performance-cwv
  cancel-in-progress: false

jobs:
  auditar:
    name: Auditar Core Web Vitals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: npm do packageManager
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - run: npm install --prefer-offline --no-audit

      - name: Rodar Lighthouse CI contra produção
        id: lhci
        env:
          LHCI_BASE_URL: https://www.hallyuhub.com.br
          LHCI_SONDA_HEADER: ${{ vars.SONDA_HEADER }}
          LHCI_SONDA_TOKEN: ${{ secrets.SONDA_TOKEN }}
        run: |
          set -euo pipefail
          npm run performance:audit || echo "houve_falha=1" >> "$GITHUB_OUTPUT"

      - name: Publicar issue de revisão
        if: always()
        uses: actions/github-script@v9
        env:
          HOUVE_FALHA: ${{ steps.lhci.outputs.houve_falha }}
        with:
          script: |
            const fs = require('fs')
            const path = require('path')

            const titulo = '⚡ Core Web Vitals — resultado semanal do Lighthouse CI'
            const dir = '.lighthouseci'
            let linhas = ['_Não foi possível ler `.lighthouseci/manifest.json` desta execução._']
            try {
              const manifesto = JSON.parse(fs.readFileSync(path.join(dir, 'manifest.json'), 'utf8'))
              linhas = manifesto
                .filter((run) => run.isRepresentativeRun !== false)
                .map((run) => {
                  const s = run.summary || {}
                  const pct = (v) => (typeof v === 'number' ? `${Math.round(v * 100)}` : '—')
                  return `| ${run.url} | ${pct(s.performance)} | ${pct(s.accessibility)} | ${pct(s['best-practices'])} | ${pct(s.seo)} |`
                })
            } catch (e) {
              linhas = [`_Erro lendo manifesto: ${e.message}_`]
            }

            // Auditorias de SEO reprovadas, por URL: sem isto a issue acusa a nota
            // baixa mas não diz qual auditoria falhou.
            const reprovadas = []
            try {
              for (const f of fs.readdirSync(dir).filter((n) => /^lhr-.*\.json$/.test(n))) {
                const lhr = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'))
                const falhas = (lhr.categories?.seo?.auditRefs || [])
                  .map((r) => lhr.audits[r.id])
                  .filter((a) => a && typeof a.score === 'number' && a.score < 1)
                  .map((a) => `\`${a.id}\``)
                if (falhas.length) reprovadas.push(`- ${lhr.finalDisplayedUrl || lhr.requestedUrl}: ${falhas.join(', ')}`)
              }
            } catch (e) {
              reprovadas.push(`_Erro lendo relatórios: ${e.message}_`)
            }

            const tabela = [
              '| URL | Performance | Acessibilidade | Boas práticas | SEO |',
              '|---|---|---|---|---|',
              ...linhas,
            ].join('\n')

            const corpo = [
              `Execução automática (\`.github/workflows/performance.yml\`), ${new Date().toISOString()}.`,
              '',
              'Lighthouse CI (`.lighthouserc.cjs`) rodado direto contra produção — mede a',
              'experiência real do visitante, não um build isolado.',
              '',
              tabela,
              '',
              ...(reprovadas.length ? ['**Auditorias de SEO reprovadas:**', ...reprovadas, ''] : []),
              process.env.HOUVE_FALHA === '1'
                ? '⚠️ Alguma assertiva do `.lighthouserc.cjs` falhou ou ficou abaixo do piso configurado — veja o log da execução.'
                : '✅ Nenhuma assertiva de erro falhou nesta execução.',
              '',
              `Log completo: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '_Esta issue é reaberta/atualizada toda segunda-feira — não crie uma nova._',
            ].join('\n')

            const abertas = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'performance',
            })
            const existente = abertas.data.find((i) => i.title === titulo)
            if (existente) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existente.number,
                body: corpo,
              })
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existente.number,
                body: `Atualizado em ${new Date().toISOString()}.`,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: titulo,
                body: corpo,
                labels: ['performance'],
              })
            }

      - name: Guardar artefatos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-ci
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 14
