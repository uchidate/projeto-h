name: Update Artist Popularity Score

# Roda em ubuntu-latest, nao no runner self-hosted. Mesmo motivo documentado em
# trending-scores.yml e streaming-scores.yml: o socket do Docker foi removido
# do runner self-hosted por seguranca (2026-09-09), e o script usa `docker cp`/
# `docker exec` por SSH via lib/wp.mjs. Sem isso o job quebraria no primeiro
# dia, como ja aconteceu com os outros dois.
#
# --top=500 (não o catálogo completo): o script consulta a Wikipédia UM
# artista por vez. Medido em 2026-09-22: ~15 artistas em ~12,6s; os 3.413 do
# catálogo levariam ~40-45min, contra ~7min com --top=500 (os mais relevantes
# por trending_score, que já é atualizado semanalmente por trending-scores.yml
# — o recorte rotaciona). Decisão registrada em
# notas/decisoes/2026-09-22-automatiza-popularidade-e-acesso-artistas.md.

on:
  schedule:
    - cron: '15 6 * * 1'  # Toda segunda-feira às 06:15 UTC (depois do trending-scores, 06:00)
  workflow_dispatch:       # Permite trigger manual

jobs:
  update:
    runs-on: ubuntu-latest
    # ~7min medido com --top=500; folga generosa sem deixar um travamento real
    # rodar o dia inteiro sem ninguém notar (mesmo padrão dos outros dois jobs).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Preparar operacao
        uses: ./.github/actions/preparar-operacao
        with:
          mascaras: ${{ secrets.IDENTIDADE_MASCARAS }}
          repositorio: ${{ vars.OPS_REPOSITORY }}
          chave: ${{ secrets.OPS_DEPLOY_KEY }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Conectar ao servidor
        uses: ./.github/actions/conectar-servidor
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          usuario: ${{ secrets.DEPLOY_USER }}
          chave: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Update artist popularity score
        env:
          WORDPRESS_API_URL: ${{ vars.WORDPRESS_API_URL }}
          # Exceção de WAF da Cloudflare: sem ela a REST do WP devolve 403 ao
          # runner e o job morre na primeira coleção (issue #19).
          SONDA_TOKEN: ${{ secrets.SONDA_TOKEN }}
        run: node scripts/update-artist-popularity.mjs --top=500 --confirm

      - name: Trigger ISR revalidation (artists)
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          # Exceção de WAF da Cloudflare para automação nossa; sem ela o POST leva 403.
          SONDA_TOKEN: ${{ secrets.SONDA_TOKEN }}
        run: |
          curl -s -X POST \
            -H "${{ vars.SONDA_HEADER }}: ${SONDA_TOKEN}" \
            "${{ vars.SITE_URL }}/api/revalidate?secret=${REVALIDATE_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"type":"artist"}' \
            -w "Revalidation: %{http_code}\n"
