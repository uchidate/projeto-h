name: 🧪 Ensaio de build no GitHub

# Monta a imagem do site num runner do GitHub, envia ao servidor com uma tag
# descartável, compara com a que está no ar e remove. NÃO publica: nenhum
# container passa a usar a imagem.
#
# O build consulta o WordPress de produção, como o build de verdade. Rodar só quando
# for medir.
on:
  pull_request:
    paths:
      - '.github/workflows/ensaio-build.yml'
      - '.github/actions/montar-imagem/**'
      - '.github/ensaio/**'
      - 'lib/imagem/**'
  workflow_dispatch:

concurrency:
  group: ensaio-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  construir:
    name: Montar a imagem
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Conectar ao servidor
        uses: ./.github/actions/conectar-servidor
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          usuario: ${{ secrets.DEPLOY_USER }}
          chave: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Montar a imagem
        uses: ./.github/actions/montar-imagem
        with:
          wordpress-url: ${{ vars.WORDPRESS_API_URL }}
          sonda-header: ${{ vars.SONDA_HEADER }}
          sonda-token: ${{ secrets.SONDA_TOKEN }}
          marcas: ensaio-medida:${{ github.run_id }}-${{ github.run_attempt }}

      - name: Medir
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/build.log"
          conta() { grep -cE "$1" "$log" || true; }
          {
            echo "### Ensaio de build"
            echo ""
            echo "- build: \`${SEGUNDOS_BUILD}s\`"
            echo "- início do build (UTC): \`$(date -u -d "@${INICIO_BUILD}" +%H:%M:%S)\`"
            echo "- respostas do WordPress: \`${RESPOSTAS_SALVAS}\` salvas antes; \`${RESPOSTAS_NOVAS}\` buscadas neste build; \`${RESPOSTAS_TOTAL}\` guardadas agora"
            echo "- erros do WordPress no build: \`$(conta 'WordPress API (error|unavailable|returned invalid)')\`"
            echo "- repetições de consulta: \`$(conta 'tentativa [0-9]+/[0-9]+, repetindo')\`"
            echo "- respostas 403/429/503 no log: \`$(conta '(error|status|HTTP)[^0-9]{0,12}(403|429|503)')\`"
            echo "- páginas geradas: \`$(grep -oE 'Generating static pages[^(]*\([0-9]+/[0-9]+\)' "$log" | tail -1 | grep -oE '[0-9]+/[0-9]+' || echo '?')\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # A imagem entra no servidor com uma tag que o deploy não conhece e sai no
      # fim do passo, mesmo se a comparação falhar.
      - name: Enviar ao servidor, comparar e remover
        env:
          IMAGE_REPO: ${{ vars.IMAGE_REPO }}
          MARCA: ensaio-medida:${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          trap 'ssh -o BatchMode=yes oc "docker image rm ${MARCA}" >/dev/null 2>&1 || echo "::warning::a imagem de ensaio ficou no servidor: ${MARCA}"' EXIT
          carga() { ssh -o BatchMode=yes oc 'cut -d" " -f1-3 /proc/loadavg'; }
          echo "carga antes do envio: $(carga)"
          echo "envio: início (UTC) $(date -u +%H:%M:%S)"
          inicio="$(date +%s)"
          docker save "$MARCA" | ssh -o BatchMode=yes oc 'docker load'
          segundos="$(( $(date +%s) - inicio ))"
          echo "envio: fim (UTC) $(date -u +%H:%M:%S)"
          echo "carga depois do envio: $(carga)"
          echo "- envio e carga no servidor: \`${segundos}s\`" | tee -a "$GITHUB_STEP_SUMMARY"
          ssh -o BatchMode=yes oc "bash -s -- ${MARCA} ${IMAGE_REPO}:latest" < .github/ensaio/comparar-imagens.sh | tee -a "$GITHUB_STEP_SUMMARY"
